name: frontend-cd

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

concurrency:
  group: frontend-cd
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        # nginx 가 같은 오리진에서 /api 를 백엔드로 넘기므로 baseURL 은 비워둔다.
        # 프론트를 다른 도메인에 올릴 거면 VITE_API_BASE_URL 시크릿을 넣는다.
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: pnpm -C frontend build

      - name: 산출물 압축
        run: tar -czf dist.tar.gz -C frontend/dist .

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 전송
        run: |
          scp -i ~/.ssh/deploy.pem dist.tar.gz \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/delipot-dist-${{ github.sha }}.tar.gz"

      - name: 릴리스 교체
        run: |
          ssh -i ~/.ssh/deploy.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "SHA=${{ github.sha }} bash -s" <<'REMOTE'
          set -euo pipefail
          WEB_DIR=/var/www/delipot
          REL="$WEB_DIR/releases/$SHA"

          # 새 디렉토리에 풀고 심링크만 바꾼다 → 교체 순간에도 반쪽 상태가 안 보인다.
          # /var/www/delipot 은 bootstrap 에서 배포 계정 소유로 잡아뒀으므로 sudo 가 필요 없다.
          mkdir -p "$REL"
          tar -xzf "/tmp/delipot-dist-$SHA.tar.gz" -C "$REL"
          ln -sfn "$REL" "$WEB_DIR/current"
          rm -f "/tmp/delipot-dist-$SHA.tar.gz"

          # 오래된 릴리스는 5개만 남긴다
          ls -1dt "$WEB_DIR/releases"/*/ | tail -n +6 | xargs -r rm -rf

          # 심링크 변경은 reload 로 충분하다 (무중단)
          sudo systemctl reload nginx
          REMOTE

      - name: 배포 확인
        run: |
          ssh -i ~/.ssh/deploy.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'curl -fsS -o /dev/null -w "index.html %{http_code}\n" http://127.0.0.1/'

      - name: 키 삭제
        if: always()
        run: rm -f ~/.ssh/deploy.pem
