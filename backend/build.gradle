plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.delipot'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Boot 4 부터 web 스타터가 spring-boot-starter-webmvc 로 갈렸다 (webflux 와 분리)
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// STOMP + 내장 SimpleBroker. spring-messaging, spring-websocket 을 가져온다.
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 세션 저장소(Redis). 커넥션 팩토리는 지연 생성이라, Redis 없이 뜨는 h2 프로파일에서도
	// InMemorySessionStore 만 쓰면 컨텍스트 로딩에는 영향 없다.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// 프론트 Orval이 소비하는 OpenAPI 스펙(/v3/api-docs) 제공. 3.x 가 Boot 4 대응 라인이다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	// 비밀번호 해싱. Spring Security 를 끌어오지 않는 순수 BCrypt 라이브러리.
	implementation 'at.favre.lib:bcrypt:0.10.2'

	// 채팅 이미지 업로드(S3). EC2는 인스턴스에 붙인 IAM 역할에서 자격증명을 자동으로 가져온다(DefaultCredentialsProvider).
	// 로컬 개발은 `aws configure`로 등록한 개인 자격증명을 동일한 방식으로 사용한다.
	implementation 'software.amazon.awssdk:s3:2.29.29'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'com.mysql:mysql-connector-j'
	// h2 프로파일 전용: MySQL 없이 백엔드만 띄워 스펙 생성/화면 확인할 때 사용
	runtimeOnly 'com.h2database:h2'

	// Boot 4 는 테스트 스타터도 슬라이스별로 갈렸다. 필요한 것만 가져온다.
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
