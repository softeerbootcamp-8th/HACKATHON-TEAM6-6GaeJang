name: backend-cd

# main 에 백엔드 변경이 머지되면 bootJar 빌드 → EC2 로 SCP 전송 → SSH 로 systemd 재시작.
# 인증: SSH 개인키(GitHub Secret). AWS API 를 쓰지 않으므로 OIDC 는 불필요.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'
  workflow_dispatch:

# 배포가 겹치면 jar 교체/재시작이 꼬일 수 있어 한 번에 하나만.
concurrency:
  group: backend-cd
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build bootJar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      # build/libs 에는 부트 jar 와 -plain.jar 이 함께 나온다. 부트 jar 만 골라
      # 버전과 무관한 고정 이름(app.jar)으로 복사해 이후 단계를 결정적으로 만든다.
      - name: Prepare artifact
        run: |
          JAR=$(ls backend/build/libs/*.jar | grep -v -- '-plain' | head -n1)
          echo "선택된 jar: $JAR"
          cp "$JAR" app.jar

      # jar 를 EC2 의 배포 디렉토리로 전송. 파일명은 app.jar 로 유지된다.
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: app.jar
          target: /delipot

      # 서비스 재시작 후 헬스체크. 실패 시 최근 로그를 출력하고 워크플로우를 실패시킨다.
      - name: Restart service & health check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            sudo systemctl restart delipot
            echo "재시작 완료, 헬스체크 대기..."
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:8080/api/health >/dev/null; then
                echo "헬스체크 성공"
                exit 0
              fi
              sleep 2
            done
            echo "헬스체크 실패 — 최근 로그:"
            sudo journalctl -u delipot -n 50 --no-pager
            exit 1
