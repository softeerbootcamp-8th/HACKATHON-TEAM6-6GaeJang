<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" font-family="'Segoe UI', 'Pretendard', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>

    <symbol id="icon-browser" viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="2" y1="8.5" x2="22" y2="8.5" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="5" cy="6.3" r="0.7" fill="currentColor"/>
      <circle cx="7.2" cy="6.3" r="0.7" fill="currentColor"/>
    </symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24">
      <path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="currentColor"/>
      <circle cx="12" cy="10" r="3" fill="#ffffff"/>
    </symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24">
      <path d="M7 18a4 4 0 0 1-.6-7.96A5 5 0 0 1 16 8.06 4.5 4.5 0 0 1 17.5 18H7z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-bucket" viewBox="0 0 24 24">
      <path d="M5 7h14l-1.4 11.8a2 2 0 0 1-2 1.7H8.4a2 2 0 0 1-2-1.7L5 7z" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <ellipse cx="12" cy="7" rx="8" ry="2.6" fill="currentColor"/>
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="3" y="13.5" width="18" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="6.5" cy="7.25" r="0.9" fill="currentColor"/>
      <circle cx="6.5" cy="16.75" r="0.9" fill="currentColor"/>
    </symbol>
    <symbol id="icon-db" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="icon-git" viewBox="0 0 24 24">
      <circle cx="6" cy="6" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="6" cy="18" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="18" cy="12" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M6 8.1V15.9" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8 6.4c4.2 0 4.2 5.6 8 5.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24">
      <path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9L19 19M5 19l2.1-2.1M16.9 7.1L19 5" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="icon-bolt" viewBox="0 0 24 24">
      <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="900" height="940" fill="#ffffff"/>

  <!-- User -->
  <rect x="40" y="56" width="150" height="94" rx="10" fill="#f7fafc" stroke="#2d3748" stroke-width="1.5"/>
  <use href="#icon-browser" x="93" y="66" width="44" height="44" color="#2d3748"/>
  <text x="115" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">사용자</text>

  <!-- Kakao Map API (external) -->
  <rect x="40" y="182" width="150" height="94" rx="10" fill="#fffbe6" stroke="#b7860b" stroke-width="1.5"/>
  <use href="#icon-pin" x="93" y="192" width="44" height="44" color="#b7860b"/>
  <text x="115" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5b00">카카오맵 API</text>

  <!-- AWS Cloud outer -->
  <rect x="280" y="160" width="570" height="700" rx="14" fill="#fffaf3" stroke="#ff9900" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="300" y="188" font-size="13" font-weight="700" fill="#b06a00">AWS Cloud (ap-northeast-2)</text>

  <!-- CloudFront -->
  <rect x="340" y="210" width="150" height="94" rx="8" fill="#f3e8ff" stroke="#6a1b9a" stroke-width="1.5"/>
  <use href="#icon-cloud" x="393" y="220" width="44" height="44" color="#6a1b9a"/>
  <text x="415" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#4a2a6b">CloudFront</text>

  <!-- S3 -->
  <rect x="660" y="210" width="150" height="94" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <use href="#icon-bucket" x="713" y="220" width="44" height="44" color="#2e7d32"/>
  <text x="735" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4d1e">S3</text>

  <!-- VPC -->
  <rect x="300" y="330" width="530" height="520" rx="12" fill="#f4f6f8" stroke="#545b64" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="320" y="356" font-size="12" font-weight="700" fill="#3d4349">VPC</text>

  <!-- Public Subnet -->
  <rect x="340" y="380" width="460" height="210" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="360" y="406" font-size="12" font-weight="700" fill="#2e7d32">Public Subnet</text>
  <rect x="420" y="430" width="300" height="140" rx="8" fill="#ffffff" stroke="#ff9900" stroke-width="1.5"/>
  <text x="435" y="452" font-size="10" font-weight="700" fill="#b06a00">EC2</text>
  <line x1="570" y1="460" x2="570" y2="550" stroke="#e2e8f0" stroke-width="1.5"/>
  <use href="#icon-server" x="473" y="460" width="44" height="44" color="#b06a00"/>
  <text x="495" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Spring 앱서버</text>
  <use href="#icon-bolt" x="628" y="460" width="44" height="44" color="#dc382d"/>
  <text x="650" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">Redis</text>

  <!-- Private Subnet -->
  <rect x="340" y="620" width="460" height="210" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="360" y="646" font-size="12" font-weight="700" fill="#1565c0">Private Subnet</text>
  <rect x="490" y="670" width="160" height="120" rx="8" fill="#ffffff" stroke="#ff9900" stroke-width="1.5"/>
  <use href="#icon-db" x="548" y="680" width="44" height="44" color="#1565c0"/>
  <text x="570" y="752" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">MySQL DB</text>

  <!-- GitHub Repository -->
  <rect x="40" y="330" width="210" height="360" rx="12" fill="#f6f8fa" stroke="#24292f" stroke-width="1.5"/>
  <text x="55" y="356" font-size="12" font-weight="700" fill="#24292f">GitHub Repository</text>

  <rect x="65" y="380" width="160" height="90" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
  <use href="#icon-gear" x="123" y="388" width="40" height="40" color="#24292f"/>
  <text x="145" y="450" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">frontend-cd</text>

  <rect x="65" y="480" width="160" height="90" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
  <use href="#icon-gear" x="123" y="488" width="40" height="40" color="#24292f"/>
  <text x="145" y="550" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">backend-cd</text>

  <rect x="65" y="580" width="160" height="90" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
  <use href="#icon-gear" x="123" y="588" width="40" height="40" color="#24292f"/>
  <text x="145" y="650" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a202c">slack-pr-notify</text>

  <!-- Slack (external) -->
  <rect x="65" y="720" width="160" height="94" rx="10" fill="#f5eef6" stroke="#4a154b" stroke-width="1.5"/>
  <use href="#icon-chat" x="123" y="730" width="44" height="44" color="#4a154b"/>
  <text x="145" y="796" text-anchor="middle" font-size="12" font-weight="700" fill="#4a154b">Slack</text>

  <!-- Arrows -->
  <!-- User -> CloudFront -->
  <path d="M190,103 C 260,103 260,257 340,257" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="215" y="160" font-size="10" fill="#2d3748">HTTPS</text>

  <!-- User -> Kakao -->
  <path d="M115,150 L 115,182" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="128" y="169" font-size="9.5" fill="#2d3748">지도 SDK 호출</text>

  <!-- CloudFront -> S3 -->
  <path d="M490,257 L 660,257" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="575" y="245" text-anchor="middle" font-size="9.5" fill="#2d3748">정적 서빙</text>

  <!-- CloudFront -> EC2 backend (Spring) -->
  <path d="M415,304 C 415,380 495,380 495,430" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="415" y="376" font-size="10" fill="#2d3748">"/api/*" 프록시 (:8080)</text>

  <!-- EC2 backend (Spring) -> EC2 db -->
  <path d="M495,570 L 570,670" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="420" y="600" font-size="10" fill="#2d3748">JDBC :3306</text>

  <!-- EC2 backend (Spring) -> S3 (direct upload, bypass CloudFront) -->
  <path d="M545,430 C 545,380 735,380 735,304" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-teal)"/>
  <text x="655" y="370" font-size="9.5" fill="#0f766e">IAM Role → PutObject</text>
  <text x="655" y="384" font-size="9.5" fill="#0f766e">(CDN 미경유 직접 업로드)</text>

  <!-- frontend-cd -> S3 -->
  <path d="M225,425 C 450,425 450,270 660,270" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="455" y="350" font-size="9.5" fill="#2d3748">S3 sync (OIDC)</text>

  <!-- frontend-cd -> CloudFront -->
  <path d="M225,395 L 340,290" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="235" y="370" font-size="9.5" fill="#2d3748">invalidate</text>

  <!-- backend-cd -> EC2 backend (Spring) -->
  <path d="M225,525 L 420,482" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="255" y="505" font-size="9.5" fill="#2d3748">SCP + SSH</text>

  <!-- slack-pr-notify -> Slack -->
  <path d="M145,670 L 145,720" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="155" y="702" font-size="9.5" fill="#2d3748">webhook</text>
</svg>
